[package]
name = "pos-ror-desktop"
version = "1.0.0"
description = "Sistema POS completo para escritorio"
authors = ["POS-RoR Team"]
repository = "https://github.com/your-username/pos-ror"
default-run = "pos-ror-desktop"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [
  "macos-private-api",
  "shell-all",
  "dialog-all", 
  "fs-all",
  "path-all",
  "os-all",
  "process-all",
  "tray-icon"
] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-path = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "pos-ror-desktop"
path = "src/main.rs"
