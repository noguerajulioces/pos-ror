[package]
name = "pos-ror-desktop"
version = "1.0.0"
description = "Sistema POS completo para escritorio"
authors = ["POS-RoR Team"]
repository = "https://github.com/your-username/pos-ror"
default-run = "pos-ror-desktop"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "pos-ror-desktop"
path = "src/main.rs"
