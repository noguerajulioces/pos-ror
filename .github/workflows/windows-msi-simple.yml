# ============================================================================
# POS-RoR Desktop - Windows MSI Build (Simplified)
# ============================================================================
# Workflow simplificado sin linting ni testing, solo build del MSI

name: 🚀 Build Windows MSI (Simple)

on:
  push:
    branches: ["main", "feature/desktop"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows-msi:
    name: 🏗️ Build MSI for Windows
    runs-on: windows-latest
    
    steps:
      # ========================================================================
      # SETUP BÁSICO
      # ========================================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ========================================================================
      # CACHE SETUP
      # ========================================================================
      - name: 💾 Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 💾 Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ========================================================================
      # HERRAMIENTAS Y DEPENDENCIAS
      # ========================================================================
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 📦 Install system dependencies
        shell: powershell
        run: |
          Write-Host "Instalando dependencias del sistema..." -ForegroundColor Green
          
          # WiX Toolset para crear MSI
          choco install wixtoolset --no-progress -y
          
          # 7-Zip para extraer Ruby portable
          choco install 7zip --no-progress -y

      - name: 🚀 Install Tauri CLI
        shell: powershell
        run: |
          Write-Host "Instalando Tauri CLI..." -ForegroundColor Green
          npm install -g @tauri-apps/cli@latest

      # ========================================================================
      # PREPARACIÓN SIMPLIFICADA DE RECURSOS
      # ========================================================================
      - name: 🔧 Prepare Ruby Portable Structure
        shell: powershell
        run: |
          Write-Host "=== Preparando Ruby Portable ===" -ForegroundColor Cyan
          
          # Verificar que rails existe (debe existir en repo)
          if (Test-Path "rails\app.rb") {
            Write-Host "[OK] Rails portable encontrado" -ForegroundColor Green
          } else {
            Write-Host "[ERROR] rails/app.rb no encontrado" -ForegroundColor Red
            exit 1
          }
          
          # Verificar que dist existe
          if (Test-Path "dist\index.html") {
            Write-Host "[OK] Frontend dist encontrado" -ForegroundColor Green
          } else {
            Write-Host "[ERROR] dist/index.html no encontrado" -ForegroundColor Red
            exit 1
          }
          
          # Intentar descargar Ruby portable (version simple)
          Write-Host "Intentando descargar Ruby portable..." -ForegroundColor Yellow
          
          try {
            $RubyUrl = "https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.2.4-1/ruby-3.2.4-1-x64-mingw32.7z"
            $RubyFile = "$env:TEMP\ruby.7z"
            
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri $RubyUrl -OutFile $RubyFile -UseBasicParsing -TimeoutSec 180
            
            Write-Host "Extrayendo Ruby..." -ForegroundColor Yellow
            & "C:\Program Files\7-Zip\7z.exe" x $RubyFile "-orails\ruby" -y | Out-Null
            
            if (Test-Path "rails\ruby\bin\ruby.exe") {
              Write-Host "[SUCCESS] Ruby portable configurado" -ForegroundColor Green
            } else {
              throw "Ruby executable no encontrado"
            }
            
            Remove-Item $RubyFile -Force -ErrorAction SilentlyContinue
          }
          catch {
            Write-Host "[WARN] No se pudo descargar Ruby portable: $_" -ForegroundColor Yellow
            Write-Host "[INFO] El MSI se generara sin Ruby portable" -ForegroundColor Cyan
            
            # Crear estructura minima para que no falle el build
            New-Item -ItemType Directory -Force -Path "rails\ruby\bin" | Out-Null
            "# Ruby placeholder" | Out-File -FilePath "rails\ruby\bin\ruby.exe" -Encoding ASCII
          }
          
          Write-Host "[SUCCESS] Estructura preparada" -ForegroundColor Green

      # ========================================================================
      # BUILD TAURI MSI
      # ========================================================================
      - name: 🔨 Build Tauri MSI
        shell: powershell
        run: |
          Write-Host "=== Construyendo MSI con Tauri ===" -ForegroundColor Cyan
          
          # Configurar WiX
          if ($env:WIX) {
            $env:PATH = "$env:WIX\bin;$env:PATH"
            Write-Host "WiX configurado: $env:WIX" -ForegroundColor Green
          }
          
          # Build
          Write-Host "Iniciando build..." -ForegroundColor Green
          tauri build --verbose
          
          # Verificar resultado
          $MsiFiles = Get-ChildItem -Path "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue
          
          if ($MsiFiles) {
            foreach ($msi in $MsiFiles) {
              $sizeMB = [math]::Round($msi.Length / 1MB, 1)
              Write-Host "[SUCCESS] MSI creado: $($msi.Name) ($sizeMB MB)" -ForegroundColor Green
            }
          } else {
            Write-Host "[ERROR] No se encontro MSI" -ForegroundColor Red
            
            # Debug info
            if (Test-Path "src-tauri\target\release\bundle") {
              Write-Host "Contenido bundle:" -ForegroundColor Yellow
              Get-ChildItem "src-tauri\target\release\bundle" -Recurse | Format-Table Name, Length
            }
            
            exit 1
          }

      # ========================================================================
      # UPLOAD ARTIFACTS
      # ========================================================================
      - name: 📤 Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-ror-desktop-msi-simple
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      # ========================================================================
      # RELEASE (SOLO PARA TAGS)
      # ========================================================================
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
          name: POS-RoR Desktop ${{ github.ref_name }}
          body: |
            # POS-RoR Desktop ${{ github.ref_name }}
            
            ## 📦 Instalacion Simplificada
            
            **NOTA:** Este es un build simplificado que puede requerir configuracion adicional.
            
            1. Descarga el archivo MSI
            2. Ejecuta como administrador
            3. Instala en Program Files
            
            ## ⚠️ Limitaciones
            
            - Ruby portable puede no estar completamente configurado
            - Requiere configuracion manual adicional
            - Solo para testing y desarrollo
            
            ---
            **Build:** ${{ github.sha }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
